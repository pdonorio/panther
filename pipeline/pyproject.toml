[project]
name = "panther-pipeline"
version = "0.1.0"
description = "Pipeline dati Normattiva -> SQLite per la PWA Panther"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
panther-build = "panther_pipeline.build:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
