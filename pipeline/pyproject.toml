[project]
name = "panther-pipeline"
version = "0.1.0"
description = "Pipeline dati Normattiva -> SQLite per la PWA Panther"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
panther-build = "panther_pipeline.build:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# editorial/ sta dentro pipeline/ ma NON è un package Python: è contenuto
# redazionale in YAML. Senza questa riga l'autodiscovery flat-layout di
# setuptools lo vede come secondo package top-level e rifiuta di costruire
# ("Multiple top-level packages discovered in a flat-layout").
[tool.setuptools.packages.find]
include = ["panther_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
