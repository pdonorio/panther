name: Build & Deploy

# Un solo workflow per dati e frontend, perché GitHub Pages pubblica in modo
# atomico: l'artefatto caricato DIVENTA il sito, non si fa upload parziale.
# Su S3 erano due job indipendenti sullo stesso bucket, con il rischio che il
# deploy del frontend cancellasse il database.

on:
  push:
    branches: [main]
  schedule:
    # 03:17 UTC — orario dispari di proposito: evita il picco di job in :00.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ripubblica anche se i dati non sono cambiati"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITO: https://pdonorio.github.io/panther

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pubblica: ${{ steps.diff.outputs.pubblica }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Gli XML sorgente dell'ultima build riuscita. Servono da rete di
      # sicurezza: l'API di Normattiva ogni tanto è indisponibile e senza
      # dati non si pubblica NULLA, nemmeno una modifica al solo frontend
      # (Pages sostituisce il sito intero, non si fa upload parziale).
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache/normattiva
          key: normattiva-xml-${{ github.run_id }}
          restore-keys: normattiva-xml-

      - name: Installa pipeline
        working-directory: pipeline
        run: pip install -e .

      - name: Build dati
        id: dati
        continue-on-error: true
        working-directory: pipeline
        run: python -m panther_pipeline.build --out ../dist-dati

      # Il client ritenta già da solo sui 5xx e sulle risposte vuote; se
      # arriva qui, Normattiva è giù sul serio. Meglio ripubblicare i dati di
      # ieri che lasciare il sito indietro di un intero deploy.
      - name: Fallback sugli XML in cache
        if: steps.dati.outcome == 'failure'
        working-directory: pipeline
        run: |
          echo "::warning::Download da Normattiva fallito, uso gli XML in cache."
          python -m panther_pipeline.build --offline --out ../dist-dati

      # Il DB è deterministico a parità di input. Il cron quindi ripubblica
      # solo se qualcosa è cambiato davvero; un push a main pubblica sempre,
      # perché lì a cambiare è il frontend, non i dati.
      - name: Serve pubblicare?
        id: diff
        run: |
          NUOVO=$(jq -r .core_db_sha256 dist-dati/manifest.json)
          VECCHIO=$(curl -fsSL "$SITO/manifest.json" | jq -r .core_db_sha256 2>/dev/null || echo assente)
          echo "nuovo=$NUOVO vecchio=$VECCHIO"
          if [ "${{ github.event_name }}" != "schedule" ] \
             || [ "$NUOVO" != "$VECCHIO" ] \
             || [ "${{ inputs.force }}" = "true" ]; then
            echo "pubblica=true" >> "$GITHUB_OUTPUT"
          else
            echo "pubblica=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Riepilogo
        run: |
          {
            echo "### Build"
            echo '```json'
            cat dist-dati/manifest.json
            echo '```'
            echo "Pubblica: ${{ steps.diff.outputs.pubblica }}"
            if [ "${{ steps.dati.outcome }}" = "failure" ]; then
              echo "⚠️ Dati dalla cache: Normattiva non raggiungibile."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build frontend
        if: steps.diff.outputs.pubblica == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Il sito è frontend + dati in un unico albero.
      - name: Unisci frontend e dati
        if: steps.diff.outputs.pubblica == 'true'
        run: |
          cp -r dist-dati/. frontend/dist/
          touch frontend/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.pubblica == 'true'
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: needs.build.outputs.pubblica == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
