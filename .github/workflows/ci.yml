name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - working-directory: pipeline
        run: pip install -e '.[dev]'
      - name: Lint
        working-directory: pipeline
        run: ruff check .
      # I test che richiedono gli XML reali si auto-skippano senza cache;
      # qui la popoliamo per esercitare i parser sul dato vero.
      - name: Build (rete)
        working-directory: pipeline
        run: python -m panther_pipeline.build --out ../dist
      - name: Test
        working-directory: pipeline
        run: pytest -q
