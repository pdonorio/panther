name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - working-directory: pipeline
        run: pip install -e '.[dev]'
      - name: Lint
        working-directory: pipeline
        run: ruff check .
      # I test che richiedono gli XML reali si auto-skippano senza cache;
      # qui la popoliamo per esercitare i parser sul dato vero.
      - name: Build (rete)
        working-directory: pipeline
        run: python -m panther_pipeline.build --out ../dist
      - name: Test
        working-directory: pipeline
        run: pytest -q

  # I test del backend girano contro un Postgres vero, non un doppio in
  # memoria: unaccent, tsvector e i vincoli sono comportamento Postgres, e un
  # doppio li nasconderebbe fino alla produzione.
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: panther
          POSTGRES_PASSWORD: panther
          POSTGRES_DB: panther
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U panther -d panther"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PANTHER_DATABASE_URL: postgresql+psycopg://panther:panther@localhost:5432/panther
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - working-directory: backend
        run: pip install -e '.[dev]'
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Estensioni Postgres
        run: psql "$PANTHER_DATABASE_URL_PSQL" -c 'CREATE EXTENSION IF NOT EXISTS unaccent;'
        env:
          PGPASSWORD: panther
          PANTHER_DATABASE_URL_PSQL: postgresql://panther@localhost:5432/panther
      - name: Test
        working-directory: backend
        run: pytest -q

  # Il deploy costruisce il frontend: se `tsc` rompe, rompe la pubblicazione.
  # Meglio accorgersene in PR.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
